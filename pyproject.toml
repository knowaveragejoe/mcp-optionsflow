[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "@knowaveragejoe/mcp-optionsflow"
version = "0.1.0"
description = "MCP server for options flow analysis"
authors = [
    { name = "Todd Wolven", email = "todd@knowaveragejoe.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["options", "trading", "finance", "analysis", "mcp", "claude"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "mcp",
    "yfinance",
    "pandas",
    "numpy",
    "scipy",
    "asyncio"
]

[project.scripts]
mcp-optionsflow = "mcp_optionsflow.main:main"

[tool.hatch.build]
packages = ["src/mcp_optionsflow"]
